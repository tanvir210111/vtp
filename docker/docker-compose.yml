version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: video_to_prompt_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - CORS_ORIGINS=http://localhost:3000
      - DATABASE_URL=sqlite:///./database/sqlite.db
      - STORAGE_PATH=/app/storage
      - OUTPUT_PATH=/app/output
    volumes:
      - ../storage:/app/storage
      - ../output:/app/output
      - ../backend/database:/app/backend/database
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: video_to_prompt_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    restart: unless-stopped
